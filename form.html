<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <form action="">
      <label for="nama">Siapa nama anda?</label><br />
      <input
        type="text"
        name="nama"
        placeholder="Kairn"
        autocomplete="name"
        required
      />
      <br />
      <label for="umur">Berapa umur anda?</label><br />
      <input type="number" name="umur" placeholder="25" required />
      <br />
      <label for="gender">Apa jenis kelamin anda?</label><br />
      <input type="radio" name="gender" />Laki-laki
      <input type="radio" name="gender" />Perempuan
      <br />
      <label for="konfirmasi">Apakah anda perokok?</label><br />
      <input type="radio" name="konfirmasi" />Ya
      <input type="radio" name="konfirmasi" />Tidak
      <br />
      <label for="jenis"
        >Jika anda perokok, rokok apa yang anda pernah coba?</label
      ><br />
      <input type="checkbox" name="jenis" />Gudang Garam Filter
      <br />
      <input type="checkbox" name="jenis" />Lucky Strike
      <br />
      <input type="checkbox" name="jenis" />Marlboro
      <br />
      <input type="checkbox" name="jenis" />Esse
      <br />
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
